<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 2px 0 0 0;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #6366f1;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #1e293b;
      font-size: 11px;
      color: #cbd5e1;
      border: 1px solid #334155;
      line-height: 1.4;
    }
    .shortcut {
      display: inline-block;
      padding: 2px 6px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      font-family: monospace;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">S</div>
    <div>
      <h1>ScrubMark Capture</h1>
      <p>Instant Video Frame Annotation</p>
    </div>
  </div>

  <button id="captureBtn" class="btn">
    📸 Screenshot Active Video (Alt+S)
  </button>

  <button id="openAppBtn" class="btn btn-secondary">
    Open ScrubMark Web App
  </button>

  <div class="status">
    💡 <strong>Tip:</strong> On YouTube or Google Drive, press <span class="shortcut">Alt+S</span> anytime to instantly snap the exact frame, copy to clipboard, and open ScrubMark review!
  </div>

  <script src="popup.js"></script>
</body>
</html>
